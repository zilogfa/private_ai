services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: private-ai-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET}"
      SEARXNG_BASE_URL: "http://127.0.0.1:8888/"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw
