<!doctype html>
<html
    lang="en"
    data-accent-color="{% block accent_color %}{% endblock %}"
>
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <meta
        name="csrf-token"
        content="{{ csrf_token() }}"
    >
    <title>
        {% block title %}{{ product.name }}{% endblock %}
    </title>
    <script
        src="{{ url_for('static', filename='js/theme.js') }}"
    ></script>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app.css') }}"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/product-shell.css') }}"
    >
    {% block head %}{% endblock %}
</head>
<body
    class="{% block body_class %}{% endblock %}"
    data-theme="{% block theme %}system{% endblock %}"
    data-product-name="{{ product.name }}"
    data-product-company="{{ product.company }}"
    data-product-mark="{{ product.mark }}"
    data-can-library="{{ '1' if can_library else '0' }}"
>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-stack">
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script
        src="{{ url_for('static', filename='js/product-shell.js') }}"
        defer
    ></script>

    {% block scripts %}{% endblock %}
</body>
</html>
