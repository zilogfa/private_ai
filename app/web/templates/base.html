<!doctype html>
<html
    lang="en"
    data-accent-color="{% block accent_color %}{% endblock %}"
>
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <meta
        name="csrf-token"
        content="{{ csrf_token() }}"
    >
    <title>
        {% block title %}Private AI{% endblock %}
    </title>
    <script
        src="{{ url_for('static', filename='js/theme.js') }}"
    ></script>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app.css') }}"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/capabilities.css') }}"
    >
</head>
<body
    class="{% block body_class %}{% endblock %}"
    data-theme="{% block theme %}system{% endblock %}"
>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-stack">
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
